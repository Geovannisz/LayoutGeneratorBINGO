name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run dist

      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Rename installer to standard format
        shell: bash
        run: |
          mv "release/BINGO Layout Generator Setup ${{ steps.get_version.outputs.VERSION }}.exe" \
             "release/BINGO.Layout.Generator.Setup.${{ steps.get_version.outputs.VERSION }}.exe"

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release/BINGO.Layout.Generator.Setup.${{ steps.get_version.outputs.VERSION }}.exe"
          artifactContentType: application/octet-stream
          name: "v${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## 🚀 BINGO Layout Generator v${{ steps.get_version.outputs.VERSION }}

            ### 📥 Download
            Baixe o arquivo `BINGO.Layout.Generator.Setup.${{ steps.get_version.outputs.VERSION }}.exe` abaixo para instalar a aplicação no Windows.

            ### 📋 Notas de Instalação
            - Execute o instalador e siga as instruções na tela
            - A aplicação será instalada automaticamente
            - Para outros sistemas operacionais, consulte [BUILD.md](https://github.com/Geovannisz/LayoutGeneratorBINGO/blob/main/BUILD.md)

            ---
            **Full Changelog**: https://github.com/Geovannisz/LayoutGeneratorBINGO/compare/v1.0.1...v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generateReleaseNotes: false
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
