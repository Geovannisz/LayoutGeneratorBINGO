name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version to release (e.g., 1.0.3)'
        required: true
        type: string

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Normalize tag input
        id: normalize
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            # Strip leading 'v' if present to avoid double 'v' prefix
            CLEAN_TAG="${INPUT_TAG#v}"
            echo "TAG=v${CLEAN_TAG}" >> $GITHUB_OUTPUT
            echo "VERSION=${CLEAN_TAG}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${{ github.ref }}" >> $GITHUB_OUTPUT
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Check out Git repository
        uses: actions/checkout@v3
        with:
          ref: ${{ steps.normalize.outputs.TAG }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run dist

      - name: Rename installer to standard format
        shell: bash
        run: |
          SOURCE_FILE="release/BINGO Layout Generator Setup ${{ steps.normalize.outputs.VERSION }}.exe"
          TARGET_FILE="release/BINGO.Layout.Generator.Setup.${{ steps.normalize.outputs.VERSION }}.exe"
          if [ -f "$SOURCE_FILE" ]; then
            mv "$SOURCE_FILE" "$TARGET_FILE"
            echo "✅ Renamed installer to standard format"
          else
            echo "❌ Source file not found: $SOURCE_FILE"
            echo "Available files in release directory:"
            ls -la release/
            exit 1
          fi

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.normalize.outputs.VERSION }}
          artifacts: "release/BINGO.Layout.Generator.Setup.${{ steps.normalize.outputs.VERSION }}.exe"
          artifactContentType: application/octet-stream
          name: "v${{ steps.normalize.outputs.VERSION }}"
          body: |
            ## 🚀 BINGO Layout Generator v${{ steps.normalize.outputs.VERSION }}

            ### 📥 Download
            Baixe o arquivo `BINGO.Layout.Generator.Setup.${{ steps.normalize.outputs.VERSION }}.exe` abaixo para instalar a aplicação no Windows.

            ### 📋 Notas de Instalação
            - Execute o instalador e siga as instruções na tela
            - A aplicação será instalada automaticamente
            - Para outros sistemas operacionais, consulte [BUILD.md](https://github.com/${{ github.repository }}/blob/main/BUILD.md)

            ---
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/v1.0.2...v${{ steps.normalize.outputs.VERSION }}
          draft: false
          prerelease: false
          generateReleaseNotes: false
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
